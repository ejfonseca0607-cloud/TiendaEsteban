spring.application.name=tienda

#Puerto por donde escucha el servidor web
server.port=80

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

#Usuario y clave de TU MySQL
spring.datasource.username=root
spring.datasource.password=12345

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#Configuración Firebase - TU proyecto
firebase.bucket.name=techshop-17b3d.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-17b3d-firebase-adminsdk-fbsvc-73731c661a.json

#Propiedades para enviar correos - Semana 11
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ejfonseca0607@gmail.com
spring.mail.password=CONTRASEÑA
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#Servidor donde está la tienda
servidor.http=http://localhost

#Tamaño máximo permitido para archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=TRACE