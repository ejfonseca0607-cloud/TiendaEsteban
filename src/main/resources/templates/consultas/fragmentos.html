<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Formularios de consultas -->
<section th:fragment="consultas" class="container py-4">
    <div class="row row-cols-1 row-cols-md-4 g-3">

        <!-- Consulta Derivada -->
        <div th:replace="~{consultas/fragmentos :: formConsulta('primary','Consulta Derivada','/consultas/consultaDerivada')}"></div>

        <!-- Consulta JPQL -->
        <div th:replace="~{consultas/fragmentos :: formConsulta('warning','Consulta JPQL','/consultas/consultaJPQL')}"></div>

        <!-- Consulta SQL -->
        <div th:replace="~{consultas/fragmentos :: formConsulta('success','Consulta SQL','/consultas/consultaSQL')}"></div>

        <!-- Práctica #2 -->
        <div>
            <form method="post" th:action="@{/consultas/consultaAmpliada}" class="was-validated">
                <div class="card h-100">

                    <div class="card-header text-center text-white bg-danger">
                        <h5>Consulta Ampliada</h5>
                    </div>

                    <div class="card-body">

                        <div class="mb-3">
                            <label>Precio inferior</label>
                            <input type="number"
                                   name="precioInf"
                                   th:value="${precioInf}"
                                   class="form-control"
                                   min="0"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Precio superior</label>
                            <input type="number"
                                   name="precioSup"
                                   th:value="${precioSup}"
                                   class="form-control"
                                   min="0"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Activo</label>
                            <select name="activo" class="form-control">
                                <option value="true">Sí</option>
                                <option value="false">No</option>
                            </select>
                        </div>

                    </div>

                    <div class="card-footer text-center">
                        <button type="submit" class="btn btn-danger text-white">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            Consultar
                        </button>
                    </div>

                </div>
            </form>
        </div>

    </div>
</section>

<!-- Formulario reutilizable -->
<div th:fragment="formConsulta(colorForm, textoForm, urlForm)">
    <form method="post" th:action="@{${urlForm}}" class="was-validated">

        <div class="card h-100">

            <div class="card-header text-center text-white"
                 th:classappend="${'bg-' + colorForm}">
                <h5>[[${textoForm}]]</h5>
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label>Precio inferior</label>
                    <input type="number"
                           name="precioInf"
                           th:value="${precioInf}"
                           class="form-control"
                           min="0"
                           required>
                </div>

                <div class="mb-3">
                    <label>Precio superior</label>
                    <input type="number"
                           name="precioSup"
                           th:value="${precioSup}"
                           class="form-control"
                           min="0"
                           required>
                </div>

            </div>

            <div class="card-footer text-center">
                <button type="submit"
                        class="btn text-white"
                        th:classappend="${'btn-' + colorForm}">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Consultar
                </button>
            </div>

        </div>

    </form>
</div>

<!-- Tarjetas de productos -->
<section th:fragment="tarjetas" class="container py-4">

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">

        <div th:each="p : ${productos}" class="col">

            <div class="card h-100 shadow-sm">

                <div class="d-flex justify-content-center align-items-center bg-light p-3"
                     style="height:200px;">

                    <img th:src="${p.rutaImagen}"
                         th:alt="${p.descripcion}"
                         class="img-fluid"
                         style="max-height:100%; object-fit:contain;">

                </div>

                <div class="card-header bg-white">
                    <h5 class="card-title text-center"
                        th:text="${p.descripcion}">
                        Producto
                    </h5>
                </div>

                <div class="card-body">

                    <p class="card-text"
                       th:text="${p.detalle}">
                        Detalle
                    </p>

                </div>

                <div class="card-footer text-center">

                    <span class="text-success h5"
                          th:text="'₡' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">
                    </span>

                    <br>

                    <span th:if="${p.existencias > 0}"
                          class="badge bg-success"
                          th:text="${p.existencias} + ' unidades'">
                    </span>

                    <span th:unless="${p.existencias > 0}"
                          class="badge bg-danger">
                        Agotado
                    </span>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
