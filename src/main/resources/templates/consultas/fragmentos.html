<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- FRAGMENTO 1: PESTAÑAS DE CATEGORÍAS -->
    <section th:fragment="tabs" class="py-3 mb-4">
        <div class="d-flex justify-content-center px-5">
            <ul class="nav nav-underline">

                <li class="nav-item">
                    <a th:href="@{/}"
                       th:classappend="${idCategoriaActual == null} ? 'active'"
                       class="nav-link"
                       aria-current="page">
                        [[#{pruebas.todas}]]
                    </a>
                </li>

                <li th:each="c : ${categorias}" class="nav-item">
                    <a th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                       th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                       class="nav-link">
                        [[${c.descripcion}]]
                    </a>
                </li>

            </ul>
        </div>
    </section>


    <!-- FRAGMENTO 2: TARJETAS DE PRODUCTOS -->
    <section th:fragment="tarjetas" class="container py-4">

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">

            <div th:each="p : ${productos}" class="col">

                <div class="card h-100 shadow-sm">

                    <!-- Imagen -->
                    <div class="d-flex justify-content-center align-items-center bg-light p-3"
                         style="height: 200px;">

                        <img th:src="${p.rutaImagen}"
                             class="img-fluid"
                             th:alt="${p.descripcion}"
                             style="max-height: 100%; object-fit: contain;"/>

                    </div>

                    <!-- Nombre -->
                    <div class="card-header bg-white">
                        <h5 class="card-title text-center text-truncate mb-0"
                            th:text="${p.descripcion}">
                            Título
                        </h5>
                    </div>

                    <!-- Detalle -->
                    <div class="card-body d-flex flex-column">

                        <p class="card-text text-muted mb-auto text-truncate"
                           th:text="${p.detalle}">
                            Detalle
                        </p>

                    </div>

                    <!-- Precio, existencias y carrito -->
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center">

                        <div class="fw-bold">

                            <span class="text-success h5"
                                  th:text="${#numbers.formatCurrency(p.precio)}">
                                ₡0
                            </span>

                            <span th:if="${p.existencias > 0}"
                                  class="badge text-bg-success ms-2"
                                  th:text="${p.existencias} + ' unidades'">
                            </span>

                            <span th:unless="${p.existencias > 0}"
                                  class="badge text-bg-danger ms-2">
                                Agotado
                            </span>

                        </div>

                        <!-- AGREGAR AL CARRITO -->
                        <form th:action="@{/carrito/agregar}"
                              method="post"
                              class="d-inline"
                              onsubmit="return addCart(this);">

                            <input type="hidden"
                                   name="idProducto"
                                   th:value="${p.idProducto}"/>

                            <button type="submit"
                                    class="btn btn-sm btn-primary"
                                    th:disabled="${p.existencias == 0}">

                                <i class="fas fa-cart-plus"></i>

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FRAGMENTO 3: FORMULARIOS DE CONSULTAS -->
    <section th:fragment="consultas"
             class="row row-cols-1 row-cols-md-3 p-2 g-3">

        <div th:replace="~{consultas/fragmentos :: formConsulta(
             'primary',
             #{consultas.derivadas},
             '/consultas/consultaDerivada')}">
        </div>

        <div th:replace="~{consultas/fragmentos :: formConsulta(
             'warning',
             #{consultas.jpql},
             '/consultas/consultaJPQL')}">
        </div>

        <div th:replace="~{consultas/fragmentos :: formConsulta(
             'success',
             #{consultas.sql},
             '/consultas/consultaSQL')}">
        </div>

    </section>


    <!-- FRAGMENTO 4: FORMULARIO FACTORIZADO -->
    <div th:fragment="formConsulta(colorForm, textoForm, urlForm)">

        <form method="post"
              th:action="@{${urlForm}}"
              class="was-validated">

            <div class="card p-2">

                <div class="card-header text-center text-white"
                     th:classappend="${'bg-' + colorForm}">

                    <h5>[[${textoForm}]]</h5>

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label>
                            [[#{consultas.precio.inferior}]]
                        </label>

                        <input type="number"
                               name="precioInf"
                               th:value="${precioInf}"
                               class="form-control"
                               min="0"
                               required/>

                    </div>

                    <div class="mb-3">

                        <label>
                            [[#{consultas.precio.superior}]]
                        </label>

                        <input type="number"
                               name="precioSup"
                               th:value="${precioSup}"
                               class="form-control"
                               min="0"
                               required/>

                    </div>

                </div>

                <div class="card-footer text-center">

                    <button type="submit"
                            class="btn text-white"
                            th:classappend="${'btn-' + colorForm}">

                        <i class="fa-solid fa-magnifying-glass"></i>
                        [[${textoForm}]]

                    </button>

                </div>

            </div>

        </form>

    </div>

</body>
</html>
