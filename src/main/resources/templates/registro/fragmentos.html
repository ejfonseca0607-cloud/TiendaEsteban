<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{general/fragmentos :: head}">
        <title>TechShop</title>
    </head>

    <body>

        <!-- 1. Fragmento para crear un nuevo usuario -->
        <section th:fragment="nuevoUsuario">

            <div class="row py-2 justify-content-center">
                <div class="col-md-3">
                    <div class="d-grid">
                        <a th:href="@{/login}" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i>
                            [[#{accion.regresar}]]
                        </a>
                    </div>
                </div>
            </div>

            <div class="row py-2 justify-content-center">
                <div class="col-md-3">

                    <form method="POST"
                          th:action="@{/registro/crearUsuario}"
                          th:object="${usuario}"
                          class="was-validated">

                        <!-- Token CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <div class="card">

                            <div class="card-header">
                                <h4>[[#{usuario.agregar}]]</h4>
                            </div>

                            <div class="card-body">

                                <div class="mb-3">
                                    <label>[[#{usuario.username}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{username}"
                                           maxlength="30"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.nombre}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           maxlength="20"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.apellidos}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{apellidos}"
                                           maxlength="30"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.correo}]]</label>
                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correo}"
                                           maxlength="75"
                                           required="true"/>
                                </div>

                            </div>

                            <div class="card-footer text-end">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-envelope"></i>
                                    [[#{usuario.activacion}]]
                                </button>
                            </div>

                        </div>

                    </form>

                </div>
            </div>

        </section>


        <!-- 2. Fragmento para activar un usuario -->
        <section th:fragment="activarUsuario">

            <div class="row py-2 justify-content-center">
                <div class="col-md-3">

                    <form method="POST"
                    th:action="@{/registro/activar(_csrf=${_csrf.token})}"
                    th:object="${usuario}"
                    class="was-validated"
                    enctype="multipart/form-data">

                        <!-- IMPORTANTE: Token CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <!-- ID del usuario -->
                        <input type="hidden"
                               th:field="*{idUsuario}"/>

                        <div class="card">

                            <div class="card-header align-items-center">
                                <h4>[[#{registro.activar}]]</h4>
                            </div>

                            <div class="card-body">

                                <div class="mb-3">
                                    <label>[[#{usuario.username}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{username}"
                                           maxlength="30"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.nombre}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           maxlength="20"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.apellidos}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{apellidos}"
                                           maxlength="30"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.correo}]]</label>
                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correo}"
                                           maxlength="75"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.telefono}]]</label>
                                    <input type="tel"
                                           class="form-control"
                                           th:field="*{telefono}"
                                           maxlength="25"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.password}]]</label>
                                    <input type="password"
                                           class="form-control"
                                           th:field="*{password}"
                                           maxlength="20"
                                           required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.imagen}]]</label>

                                    <input class="form-control"
                                           type="file"
                                           name="imagenFile"
                                           onchange="mostrarImagen(this);"/>

                                    <img id="blah"
                                         th:src="@{${usuario.rutaImagen}}"
                                         alt="Imagen del usuario"
                                         height="200"/>
                                </div>

                            </div>

                            <div class="card-footer align-items-center">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-check"></i>
                                    [[#{usuario.activacion}]]
                                </button>
                            </div>

                        </div>

                    </form>

                </div>
            </div>

        </section>


        <!-- 3. Fragmento para recordar un usuario -->
        <section th:fragment="recordarUsuario">

            <div class="row py-2 justify-content-center">
                <div class="col-md-3">
                    <div class="d-grid">
                        <a th:href="@{/login}" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i>
                            [[#{accion.regresar}]]
                        </a>
                    </div>
                </div>
            </div>

            <div class="row py-2 justify-content-center">
                <div class="col-md-3">

                    <form method="POST"
                          th:action="@{/registro/recordarUsuario}"
                          th:object="${usuario}"
                          class="was-validated">

                        <!-- Token CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <div class="card">

                            <div class="card-header">
                                <h4>[[#{registro.recordar.us}]]</h4>
                            </div>

                            <div class="card-body">

                                <div class="mb-3">
                                    <label>[[#{usuario.username}]]</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{username}"
                                           maxlength="30"/>
                                </div>

                                <div class="mb-3">
                                    <label>[[#{usuario.correo}]]</label>
                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correo}"
                                           maxlength="75"/>
                                </div>

                            </div>

                            <div class="card-footer text-end">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-address-card"></i>
                                    [[#{registro.recordar.us}]]
                                </button>
                            </div>

                        </div>

                    </form>

                </div>
            </div>

        </section>


        <!-- 4. Fragmento para mostrar las salidas de las acciones -->
        <section th:fragment="salidaRegistro">

            <div class="row py-2 justify-content-center">
                <div class="col-md-3">

                    <div class="card">

                        <div class="card-header align-items-center">
                            [[${titulo}]]
                        </div>

                        <div class="card-body">
                            <strong>[[${mensaje}]]</strong>
                        </div>

                    </div>

                </div>
            </div>

        </section>

    </body>
</html>
