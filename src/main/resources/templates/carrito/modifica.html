<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>Modificar carrito</title>
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"/>

        <section class="container py-4">

            <div class="row mb-3">
                <div class="col-12">
                    <a th:href="@{/carrito/listado}"
                       class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i>
                        Regresar
                    </a>
                </div>
            </div>

            <div class="card shadow-lg mx-auto"
                 style="max-width: 800px;">

                <div class="card-header">
                    <h4>Modificar producto</h4>
                </div>

                <div class="card-body">

                    <div class="row align-items-center">

                        <div class="col-md-4 text-center mb-3 mb-md-0">

                            <img th:src="@{${item.producto.rutaImagen}}"
                                 width="150"
                                 alt="Imagen del producto"
                                 class="rounded shadow-sm"/>

                        </div>

                        <div class="col-md-8">

                            <h5 th:text="${item.producto.descripcion}">
                                Producto
                            </h5>

                            <p class="text-muted"
                               th:text="${item.producto.detalle}">
                                Detalle
                            </p>

                            <p>
                                <strong>Precio:</strong>

                                <span th:text="${#numbers.formatCurrency(item.precioHistorico)}">
                                    ₡0
                                </span>
                            </p>

                            <form th:action="@{/carrito/actualizar}"
                                  method="post"
                                  th:object="${item}">

                                <input type="hidden"
                                       th:field="*{producto.idProducto}"/>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Cantidad
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{cantidad}"
                                           min="1"
                                           th:max="${item.producto.existencias}"
                                           required/>

                                </div>

                                <div class="mb-3">

                                    <strong>Subtotal:</strong>

                                    <span th:text="${#numbers.formatCurrency(item.subTotal)}">
                                        ₡0
                                    </span>

                                </div>

                                <button type="submit"
                                        class="btn btn-success">

                                    <i class="fas fa-save"></i>
                                    Guardar

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>

        <footer th:replace="~{general/fragmentos :: footer}"/>

    </body>

</html>
